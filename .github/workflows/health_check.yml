name: Bossa Sunningdale — Daily Dashboard Health Check

# Verifies once a day that:
#   1. daily_bar.yml has a successful run completed today (SAST), AND
#   2. The Netlify-served dashboard's "Updated" timestamp is today (SAST).
#
# Self-healing covers the two independent ways the dashboard can go stale:
#   1. GitHub drops the scheduled daily_bar.yml cron (no successful run today) →
#      auto-trigger daily_bar.yml via workflow_dispatch.
#   2. daily_bar.yml ran and pushed fresh HTML, but Netlify's Git auto-deploy
#      stalled so the live site is stale (happened 2026-06-22) → POST the
#      Netlify build hook to force a deploy from latest main. Re-running
#      daily_bar can't fix this — it would just push again to a Netlify that
#      isn't deploying — so the build hook is the only real recovery here.
# When auto-recovery fires, we open an info-level GitHub issue so there's an
# audit trail, but exit 0 (no failure email — the system healed itself).
#
# Hard failures (fetch error, parse error, recovery failed) still open an
# issue, fail the workflow, and trigger the standard failure email.
#
# Separately, it polls Netlify build-minute usage (only if NETLIFY_API_TOKEN is
# set) and warns BEFORE the monthly quota runs out — quota exhaustion suspends
# all Netlify deploys and froze the live dashboard for 6 days in Jun 2026, and a
# build hook can't fix it. ≥80% used → info issue (no email); ≥95% → hard
# failure (email). Skipped silently if the token is unset.
#
# Crons: two slots so GitHub silently dropping one (a known platform issue —
# the same reason daily_bar.yml runs two) still leaves a check for the day.
#   Primary : 09:33 UTC = 11:33 SAST
#   Backup  : 11:33 UTC = 13:33 SAST
# Both are sized to fire well after both scheduled daily_bar.yml runs (03:13 UTC
# and 05:17 UTC targets) have had time to complete given typical 4-5h GH Actions
# cron delays. A second run on a healthy day just re-prints "Healthy" and exits 0;
# same-title/same-date issue dedup prevents duplicate issues on a failing day.

on:
  schedule:
    - cron: '33 9 * * *'    # 11:33 SAST — primary
    - cron: '33 11 * * *'   # 13:33 SAST — backup, in case GitHub drops the primary cron
  workflow_dispatch:

permissions:
  contents: read
  issues:   write
  actions:  write   # needed to workflow-dispatch daily_bar.yml on cron-drop recovery

jobs:
  health-check:
    name: Verify dashboard freshness
    runs-on: ubuntu-latest

    steps:
      - name: Run health check
        env:
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:                ${{ github.repository }}
          DASHBOARD_URL:          https://bossa-sunningdale.netlify.app/
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          NETLIFY_API_TOKEN:      ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_ACCOUNT_ID:     ${{ secrets.NETLIFY_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from datetime import datetime, timezone, timedelta

          SAST = timezone(timedelta(hours=2))
          today_sast = datetime.now(SAST).date()
          today_str  = today_sast.isoformat()

          REPO = os.environ["GH_REPO"]

          def gh(args):
              """Run gh CLI, surface stderr on failure."""
              r = subprocess.run(args, capture_output=True, text=True)
              if r.returncode != 0:
                  sys.stderr.write(
                      f"::error::gh command failed: {' '.join(args)}\n"
                      f"stdout: {r.stdout}\nstderr: {r.stderr}\n"
                  )
                  sys.exit(2)
              return r.stdout

          problems   = []   # hard failures → open issue, fail workflow
          recoveries = []   # auto-healed   → open info issue, exit 0
          warnings   = []   # early warnings (build-credit) → info issue, exit 0

          # ── 1. Did daily_bar.yml complete successfully today? ────────────────
          out = gh(["gh", "run", "list",
                    "--repo", REPO,
                    "--workflow=daily_bar.yml",
                    "--limit=10",
                    "--json", "status,conclusion,updatedAt,url"])
          runs = json.loads(out)

          in_progress = any(r["status"] in ("queued", "in_progress", "waiting") for r in runs)

          completed_today_success = False
          latest_completion = None
          for r in runs:
              if r["status"] != "completed":
                  continue
              ts = datetime.fromisoformat(r["updatedAt"].replace("Z", "+00:00")).astimezone(SAST)
              if latest_completion is None:
                  latest_completion = (r, ts)
              if ts.date() == today_sast and r["conclusion"] == "success":
                  completed_today_success = True
                  break

          # If no successful run today and nothing is in progress, GitHub
          # almost certainly dropped both scheduled crons. Self-heal by
          # triggering daily_bar.yml via workflow_dispatch.
          skip_dashboard_check = False
          if not completed_today_success:
              if in_progress:
                  print("ℹ️  daily_bar.yml is still running — skipping alert, will retry tomorrow.")
                  sys.exit(0)

              print("⚠️  No successful daily_bar.yml run today — auto-triggering as recovery.")
              trigger = subprocess.run(
                  ["gh", "workflow", "run", "daily_bar.yml",
                   "--repo", REPO, "--ref", "main"],
                  capture_output=True, text=True,
              )
              if trigger.returncode != 0:
                  problems.append(
                      "GitHub Actions did not fire the scheduled `daily_bar.yml` today "
                      "AND auto-recovery failed: "
                      f"`{trigger.stderr.strip() or trigger.stdout.strip()}`. "
                      "Trigger the workflow manually."
                  )
              else:
                  recoveries.append(
                      "GitHub Actions did not fire the scheduled `daily_bar.yml` today. "
                      f"Health check auto-triggered it at "
                      f"{datetime.now(SAST).strftime('%H:%M SAST')} — "
                      "dashboard should refresh within ~3 min."
                  )
                  # Skip the freshness check below — bar is about to run.
                  skip_dashboard_check = True

          # ── 2. Is the Netlify-served dashboard fresh? ────────────────────────
          dashboard_url = os.environ["DASHBOARD_URL"]
          html = ""
          if skip_dashboard_check:
              print("ℹ️  Skipping dashboard freshness check — bar workflow just triggered.")
          else:
              try:
                  req = urllib.request.Request(
                      dashboard_url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "bossa-health-check/1"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  problems.append(f"Could not fetch dashboard at {dashboard_url}: {e}")

          if html:
              # Freshness is read from a machine-readable marker the generator
              # emits (a <meta name="dashboard-generated"> tag carrying a TZ-aware
              # ISO timestamp). This is decoupled from the visual template so a
              # dashboard redesign can't silently break the monitor.
              m = re.search(
                  r'<meta name="dashboard-generated" content="([^"]+)"',
                  html,
              )
              if not m:
                  problems.append(
                      "Couldn't find `dashboard-generated` meta tag in dashboard HTML — "
                      "generator may have changed."
                  )
              else:
                  try:
                      dashboard_dt = datetime.fromisoformat(m.group(1)).astimezone(SAST)
                      if dashboard_dt.date() != today_sast:
                          stale_msg = (
                              f"Dashboard generated **{dashboard_dt.strftime('%d %b %Y %H:%M SAST')}** "
                              f"but today (SAST) is **{today_str}**. "
                              f"Netlify did not deploy the latest commit."
                          )
                          # daily_bar.yml succeeded and pushed fresh HTML today
                          # (the cron-drop recovery above did not fire), yet the
                          # live site is stale → Netlify's Git auto-deploy stalled
                          # (happened 2026-06-22). Re-dispatching daily_bar wouldn't
                          # help — it would just push again. Force a deploy via the
                          # Netlify build hook instead; that's the only real fix for
                          # the Netlify-side failure the cron-drop recovery is blind to.
                          hook = os.environ.get("NETLIFY_BUILD_HOOK_URL", "")
                          if hook:
                              try:
                                  hook_req = urllib.request.Request(
                                      hook, data=b"{}", method="POST"
                                  )
                                  with urllib.request.urlopen(hook_req, timeout=30) as hr:
                                      hr.read()
                                  recoveries.append(
                                      stale_msg + " Health check POSTed the Netlify build "
                                      "hook to force a redeploy — the live site should "
                                      "refresh within ~1–2 min."
                                  )
                              except Exception as e:
                                  problems.append(
                                      stale_msg + f" Auto-redeploy via the Netlify build "
                                      f"hook also failed (`{e}`). Trigger a deploy manually "
                                      "in the Netlify dashboard."
                                  )
                          else:
                              problems.append(
                                  stale_msg + " Set the `NETLIFY_BUILD_HOOK_URL` secret so "
                                  "the health check can auto-redeploy; for now trigger a "
                                  "deploy manually in the Netlify dashboard."
                              )
                  except ValueError as e:
                      problems.append(f"Couldn't parse dashboard-generated timestamp: {e}")

          # ── 2b. Netlify build-credit early warning ───────────────────────────
          # Build-minute exhaustion (not a code fault) caused the 6-day Jun 2026
          # outage: at the monthly quota Netlify suspends ALL deploys, so pushes
          # to main stop going live and a build hook can't help. Poll the
          # account's build-minute usage and warn BEFORE the quota runs out.
          # Optional: needs a Netlify PAT in NETLIFY_API_TOKEN; skipped if unset.
          # A monitoring hiccup here must never fail the health check itself.
          api_token = os.environ.get("NETLIFY_API_TOKEN", "")
          if api_token:
              try:
                  def netlify_get(path):
                      r = urllib.request.Request(
                          f"https://api.netlify.com/api/v1/{path}",
                          headers={"Authorization": f"Bearer {api_token}",
                                   "User-Agent": "bossa-health-check/1"},
                      )
                      with urllib.request.urlopen(r, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8", errors="ignore"))

                  # Netlify's build-status endpoint is /{account_slug}/builds/status
                  # — no "accounts/" prefix, and keyed by the account *slug*, not id.
                  # Resolve the account that actually OWNS the dashboard site: the token
                  # may see several accounts and accounts[0] is arbitrary (often a near-
                  # empty personal one reporting a 0 quota). Fall back to accounts[0]
                  # only if the site lookup fails.
                  account_slug = os.environ.get("NETLIFY_ACCOUNT_ID", "")
                  if not account_slug:
                      host = os.environ.get("DASHBOARD_URL", "").split("//")[-1].split("/")[0]
                      site_name = host.split(".")[0]
                      try:
                          for s in netlify_get(f"sites?name={site_name}"):
                              if s.get("name") == site_name:
                                  account_slug = s.get("account_slug") or ""
                                  break
                      except Exception:
                          pass
                  if not account_slug:
                      accounts = netlify_get("accounts")
                      account_slug = (accounts[0].get("slug") or accounts[0].get("id")) if accounts else ""

                  if not account_slug:
                      print("ℹ️  Netlify usage check: no account found for token.")
                  else:
                      print(f"ℹ️  Netlify account resolved: {account_slug}")
                      mins = (netlify_get(f"{account_slug}/builds/status")
                              .get("minutes", {}) or {})
                      used     = float(mins.get("current", 0) or 0)
                      included = float(mins.get("included_minutes_with_packs")
                                       or mins.get("included_minutes", 0) or 0)
                      if included > 0:
                          pct = used / included * 100
                          print(f"ℹ️  Netlify build minutes: {used:.0f}/{included:.0f} "
                                f"({pct:.0f}%) this period.")
                          usage = (f"Netlify build minutes at **{pct:.0f}%** "
                                   f"({used:.0f}/{included:.0f} used this period). "
                                   "At 100% Netlify suspends all deploys and the live "
                                   "dashboard freezes — this caused the Jun 2026 outage.")
                          if pct >= 95:
                              problems.append(
                                  usage + " **Imminent** — cut deploy frequency or "
                                  "raise the quota now."
                              )
                          elif pct >= 80:
                              warnings.append(
                                  usage + " Heads-up to watch usage before the billing "
                                  "period resets."
                              )
                      else:
                          # Endpoint reachable but no included-minute quota reported —
                          # print what we got so the monitor stays observable.
                          print(f"ℹ️  Netlify usage: {used:.0f} min used this period; "
                                f"included-minute quota not reported by the API "
                                f"(minutes keys: {sorted(mins.keys())}).")
              except Exception as e:
                  print(f"ℹ️  Could not check Netlify build usage: {e}")

          # ── 3. Healthy → exit ────────────────────────────────────────────────
          if not problems and not recoveries and not warnings:
              print("✅ Healthy — dashboard refreshed today (SAST).")
              sys.exit(0)

          # ── 4. Open or skip a deduped issue ──────────────────────────────────
          actions_url = f"https://github.com/{os.environ['GH_REPO']}/actions"

          if problems:
              title = f"⚠️ Bar dashboard health check failed — {today_str}"
              body_lines = ["Hard failures:"]
              body_lines += [f"- {p}" for p in problems]
              if recoveries:
                  body_lines += ["", "Auto-recovered (informational):"]
                  body_lines += [f"- {r}" for r in recoveries]
              if warnings:
                  body_lines += ["", "Warnings:"]
                  body_lines += [f"- {w}" for w in warnings]
          else:
              title = f"ℹ️ Bar dashboard notice — {today_str}"
              body_lines = []
              if recoveries:
                  body_lines += ["Auto-recovered (GitHub dropped a scheduled run, "
                                 "or Netlify deploy stalled):"]
                  body_lines += [f"- {r}" for r in recoveries]
              if warnings:
                  if body_lines:
                      body_lines += [""]
                  body_lines += ["Warnings:"]
                  body_lines += [f"- {w}" for w in warnings]

          body = (
              f"Health check on **{today_str}** (SAST):\n\n"
              + "\n".join(body_lines)
              + "\n\n"
              + f"See [GitHub Actions]({actions_url}).\n\n"
              + "_Opened automatically by `health_check.yml`._\n"
          )

          existing = gh(["gh", "issue", "list",
                         "--repo", REPO,
                         "--state=open",
                         "--search", f'in:title "{title}"',
                         "--json", "number"])
          dups = json.loads(existing)
          if dups:
              print(f"Issue already open (#{dups[0]['number']}); not re-opening.")
          else:
              gh(["gh", "issue", "create",
                  "--repo", REPO,
                  "--title", title,
                  "--body",  body])
              print("Opened issue.")

          # Hard failures fail the workflow (triggers the standard email).
          # Pure auto-recovery exits 0 (issue is the audit trail; no email noise).
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("✅ Notice posted (no hard failure) — exiting 0.")
          sys.exit(0)
          EOF
