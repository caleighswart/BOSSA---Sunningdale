name: Bossa Sunningdale — Daily Bar Stock Dashboard (paused)

on:
  # Two scheduled runs per day, ~2h apart, to harden against GitHub Actions
  # silently dropping a scheduled cron (a known platform issue). The dashboard
  # generator is fully idempotent and the commit step is "nothing to commit"
  # safe, so running twice on a normal day is harmless.
  #   Primary : 03:13 UTC = 05:13 SAST target (lands ~07:13–08:13 SAST)
  #   Backup  : 05:17 UTC = 07:17 SAST target (lands ~09:17–10:17 SAST)
  # If GitHub drops *both*, the 11:33 SAST health check auto-triggers a run.
  # ── PAUSED 2026-08-28 ─────────────────────────────────────────────────
  # Project on hold — no daily refresh, no daily Netlify deploy, no daily
  # PilotLive pull. Schedules commented out rather than deleted so re-enabling is
  # a two-line uncomment. Manual trigger below still regenerates the dashboard
  # on demand. Note: health_check.yml is paused too, so nothing will notice or
  # auto-recover a stale dashboard while this is off.
  # schedule:
  #   - cron: '13 3 * * *'
  #   - cron: '17 5 * * *'

  # Manual trigger from the Actions tab (for testing / recovery)
  workflow_dispatch:

jobs:
  refresh-dashboard:
    name: Refresh bar stock dashboard
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push docs/index.html so Netlify auto-deploys it

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r bar/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Apply any par levels managers entered on the dashboard Admin tab BEFORE
      # generating, so generate_dashboard.py picks them up from pars.json. No-ops
      # safely if the Netlify secrets aren't set (see merge_par_overrides.mjs).
      - name: Merge par overrides into pars.json
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID:   ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm ci --omit=dev || npm install --omit=dev
          node bar/merge_par_overrides.mjs

      - name: Test SSRS connection
        continue-on-error: true
        env:
          PILOTLIVE_USERNAME: ${{ secrets.PILOTLIVE_USERNAME }}
          PILOTLIVE_PASSWORD: ${{ secrets.PILOTLIVE_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys, requests
          from requests_ntlm import HttpNtlmAuth
          u = os.environ.get("PILOTLIVE_USERNAME", "")
          p = os.environ.get("PILOTLIVE_PASSWORD", "")
          print(f"Username set: {bool(u)} | Password set: {bool(p)}")
          url = "https://reports.pilotlive.co.za/ReportServer?%2fStock+Management%2fTheoretical+Stock+On+Hand&rs:Command=Render&rs:Format=XML&dclink=8689"
          try:
              r = requests.get(url, auth=HttpNtlmAuth(u, p), timeout=60)
              print(f"SSRS status: {r.status_code} | Size: {len(r.content)} bytes")
              if r.status_code != 200:
                  print(f"Error body: {r.text[:500]}")
                  sys.exit(1)
              else:
                  print("SSRS connection OK")
          except Exception as e:
              print(f"SSRS connection FAILED: {e}")
              sys.exit(1)
          EOF

      - name: Generate dashboard
        working-directory: bar
        env:
          PILOTLIVE_USERNAME:    ${{ secrets.PILOTLIVE_USERNAME }}
          PILOTLIVE_PASSWORD:    ${{ secrets.PILOTLIVE_PASSWORD }}
          BOSSA_ORDERS_WEBHOOK:  ${{ secrets.BOSSA_ORDERS_WEBHOOK }}
        run: python generate_dashboard.py

      # Fail loudly the same morning if a redesign dropped the hidden freshness
      # marker the health check depends on, instead of letting health_check.yml
      # discover it days later as a false alarm. (See Known Issues 2026-06-19.)
      - name: Verify freshness marker present
        run: |
          if ! grep -q '<meta name="dashboard-generated"' docs/index.html; then
            echo "::error::docs/index.html is missing the dashboard-generated meta tag — health_check.yml depends on it. A redesign likely dropped it; re-add it in bar/generate_dashboard.py <head>."
            exit 1
          fi
          echo "✅ dashboard-generated marker present."

      - name: Commit dashboard for Netlify deploy
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the dashboard and pars.json (the latter changes only when a
          # manager entered a new par via the Admin tab — merged in above).
          git add docs/index.html bar/pars.json
          if git diff --cached --quiet; then
            echo "Dashboard unchanged — nothing to commit."
          else
            git commit -m "chore: update bar stock dashboard"
            git push
            # Belt-and-suspenders: explicitly tell Netlify to deploy this push.
            # Netlify's Git auto-deploy silently stalled on 2026-06-22 — the repo
            # stayed fresh but the live site went stale for days. A build hook
            # forces a deploy from latest main independent of the Git webhook.
            # Degrades gracefully if the secret isn't set yet (Git auto-deploy only).
            if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
              echo "Triggering Netlify build hook..."
              curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL" \
                && echo "✅ Netlify deploy triggered." \
                || echo "::warning::Netlify build hook POST failed — check the deploy in the Netlify dashboard."
            else
              echo "::warning::NETLIFY_BUILD_HOOK_URL not set — relying on Netlify Git auto-deploy only."
            fi
          fi

      # Clear consumed par overrides LAST — only reached when every prior step
      # (merge, generate, commit/push) succeeded, so the merged pars.json is
      # safely on origin/main before any override is deleted. If an earlier step
      # fails, this is skipped and the override stays in Blobs to re-apply next
      # run, so a mid-run failure never drops a manager's edit. Deletes only
      # overrides whose value is now reflected in pars.json.
      - name: Clear consumed par overrides
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID:   ${{ secrets.NETLIFY_SITE_ID }}
        run: node bar/merge_par_overrides.mjs --clear
